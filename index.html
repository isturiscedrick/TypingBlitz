<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Typing Blitz</title>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <style>
    /* Centering the Canvas */
    body { 
      margin: 0; 
      overflow: hidden; 
      background: #050505; 
      font-family: 'Michroma', 'Courier New', Courier, monospace; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #startScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.9);
      color: #0ff;
      text-align: center;
      z-index: 10;
    }

    #startScreen h1 {
      font-size: 60px;
      margin-bottom: 10px;
      color: #0ff;
      letter-spacing: 2px;
      text-shadow: 0 0 24px #0ff, 0 0 60px #0ff, 0 0 8px #fff;
      font-family: 'Michroma', 'Courier New', Courier, monospace;
      animation: neonPulse 2s infinite alternate;
    }
    #startScreen h2 {
      font-size: 24px;
      color: #fff;
      margin-bottom: 30px;
      font-weight: 400;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #0ff, 0 0 2px #fff;
      font-family: 'Michroma', 'Courier New', Courier, monospace;
    }
    #startScreen p {
      font-size: 18px;
      margin: 5px 0;
      color: #fff;
      opacity: 0.85;
      font-family: 'Michroma', 'Courier New', Courier, monospace;
    }
    #startButton, #howToButton {
      margin-top: 24px;
      padding: 16px 48px;
      font-size: 22px;
      font-weight: bold;
      color: #0ff;
      background: rgba(0,0,40,0.95);
      border: 2px solid #0ff;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 0 24px #0ff, 0 0 4px #fff;
      letter-spacing: 1px;
      transition: box-shadow 0.3s, background 0.2s, color 0.2s;
      font-family: 'Michroma', 'Courier New', Courier, monospace;
      margin-bottom: 12px;
    }
    #startButton:hover, #howToButton:hover {
      background: #0ff;
      color: #000;
      box-shadow: 0 0 40px #0ff, 0 0 8px #fff;
      border-color: #fff;
    }
    @keyframes neonPulse {
      0% { text-shadow: 0 0 24px #0ff, 0 0 60px #0ff, 0 0 8px #fff; }
      100% { text-shadow: 0 0 48px #0ff, 0 0 120px #0ff, 0 0 16px #fff; }
    }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>
<body>



  <script src="p5.js"></script>


</body>
</html>
